<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>user-flow · Lighthouse user flows done right</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A CLI and library to organise and run Lighthouse user flows with CI automation, TypeScript support and zero setup cost."
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0D121C"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Apply a stored theme before the first paint so the page never flashes the wrong one.
      try {
        var theme = localStorage.getItem('user-flow-docs-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <docs-root></docs-root>
  </body>
</html>
