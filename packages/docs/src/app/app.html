<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container site-header-inner">
    <a class="brand" routerLink="/" aria-label="user-flow start page">
      <img
        class="brand-logo"
        src="images/user-flow-mark.png"
        alt=""
        width="32"
        height="32"
      />
      <span class="brand-name">user-flow</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a
        class="site-nav-link"
        routerLink="/docs/getting-started/introduction"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ matrixParams: 'ignored', queryParams: 'ignored', paths: 'subset', fragment: 'ignored' }"
        >Docs</a
      >
      <a
        class="site-nav-link"
        href="https://www.npmjs.com/package/@push-based/user-flow"
        target="_blank"
        rel="noopener noreferrer"
        >npm</a
      >
      <a
        class="site-nav-link"
        href="https://github.com/push-based/user-flow"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub</a
      >
    </nav>
    <button
      class="theme-toggle"
      type="button"
      (click)="toggleTheme()"
      aria-label="Toggle dark mode"
      title="Toggle dark mode"
    >
      <svg
        class="icon-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
      </svg>
      <svg
        class="icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
        />
      </svg>
    </button>
    @if (isDocs()) {
    <button
      class="menu-toggle pb-btn pb-btn-ghost"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="sidebar"
    >
      {{ menuOpen() ? 'Close' : 'Menu' }}
    </button>
    }
  </div>
</header>

<div class="container page" [class.page-docs]="isDocs()">
  @if (isDocs()) {
  <aside id="sidebar" class="sidebar" [class.sidebar-open]="menuOpen()">
    <nav aria-label="Documentation">
      @for (section of nav; track section.slug) {
      <p class="sidebar-section text-subtitle">{{ section.title }}</p>
      <ul class="sidebar-list">
        @for (page of section.pages; track page.slug) {
        <li>
          <a
            class="sidebar-link"
            [routerLink]="['/docs', section.slug, page.slug]"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            {{ page.title }}
          </a>
        </li>
        }
      </ul>
      }
    </nav>
  </aside>
  }
  <main id="main" class="main">
    <router-outlet />
  </main>
</div>
