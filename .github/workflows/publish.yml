name: publish

on:
  push:
    tags:
      - cli-*.*.*
      - nx-plugin-*.*.*
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

# configured as trusted publisher (OIDC)
# https://docs.npmjs.com/trusted-publishers
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages
    # This line is critical for copy paste issues
    if: github.repository == 'push-based/user-flow'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        # trusted publishing requires npm >= 11.5.1, which ships with Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select projects
        # a tag push (e.g. cli-0.21.4) publishes only its project, a manual run publishes all
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "PROJECTS=${GITHUB_REF_NAME%-*}" >> "$GITHUB_ENV"
          else
            echo "PROJECTS=cli,nx-plugin" >> "$GITHUB_ENV"
          fi
      - name: Build packages
        # `nx release publish` only runs nx-release-publish tasks and skips their
        # `build` dependency, so dist/ has to exist before it runs
        run: npx nx run-many -t build --projects="$PROJECTS"
      - name: Publish packages to npm
        run: npx nx release publish --projects="$PROJECTS"
