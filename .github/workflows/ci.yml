name: ci

on:
  pull_request:
    paths-ignore:
      - '*.md'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    name: Node ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - name: install
        run: npm ci
      - name: diag env
        run: |
          set +e
          echo "npm $(npm -v) node $(node -v)"; echo "userconfig=$NPM_CONFIG_USERCONFIG"; cat "$NPM_CONFIG_USERCONFIG" || true
          echo "--- npx cache"; ls -la ~/.npm/_npx 2>/dev/null || echo "no _npx"; for d in ~/.npm/_npx/*/; do echo "$d"; cat "$d/package.json" 2>/dev/null; ls "$d/node_modules/.bin" 2>/dev/null; done
          exit 0
      - name: diag npx run
        run: |
          set +e
          npx @push-based/user-flow collect --no-interactive > /tmp/out.txt 2> /tmp/err.txt; echo "exit=$?"
          echo "--- stdout"; cat /tmp/out.txt; echo "--- stderr"; cat /tmp/err.txt
          echo "--- npx cache after"; for d in ~/.npm/_npx/*/; do echo "$d"; cat "$d/package.json"; ls -la "$d/node_modules/.bin"; done
          exit 0
      - name: diag nx-plugin test
        run: npm run nx -- run nx-plugin:test --skip-nx-cache || true
      - name: diag npx run from empty dir
        run: |
          set +e
          mkdir -p /tmp/empty && cd /tmp/empty
          npx @push-based/user-flow collect --no-interactive > /tmp/out2.txt 2> /tmp/err2.txt; echo "exit=$?"
          echo "--- stdout"; cat /tmp/out2.txt; echo "--- stderr"; cat /tmp/err2.txt
          exit 0
