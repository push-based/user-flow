name: user-flow-gh-integration

on:
  pull_request:
    paths-ignore:
      - '*.md'

jobs:
  user-flow-integrated-in-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        node-version: [22.x]
    name: Node ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: ${{ matrix.node-version }}

      - name: install
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      # The npm cache restores ~/.npm/_npx, so npx would reuse the cached CLI and skip
      # the puppeteer postinstall that downloads the Chrome version the CLI needs.
      - name: Clear cached npx installs
        run: rm -rf ~/.npm/_npx

      - name: run:user-flow-action
        uses: push-based/user-flow-gh-action@v0.3.2
        with:
          rcPath: examples/github-report/.user-flowrc.json
